<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D-просмотр модели</title>
<style>
  :root { --bg1:#1d2333; --bg2:#0e1119; --panel:rgba(20,24,36,.86); --line:rgba(255,255,255,.12); --text:#eef1f7; --muted:#9aa3b5; --accent:#4f8cff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg2); color:var(--text); font:15px/1.4 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:0; }
  canvas { display:block; touch-action:none; }
  .panel { position:fixed; right:16px; top:16px; width:280px; max-height:calc(100% - 32px); overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; backdrop-filter:blur(8px); }
  .panel h1 { font-size:16px; margin:0 0 2px; }
  .panel .sub { color:var(--muted); font-size:13px; margin:0 0 12px; }
  .section { border-top:1px solid var(--line); padding-top:10px; margin-top:10px; }
  .section h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 8px; font-weight:600; }
  .clips { display:flex; flex-wrap:wrap; gap:6px; }
  button { font:inherit; color:var(--text); background:rgba(255,255,255,.06); border:1px solid var(--line); border-radius:9px; padding:7px 10px; cursor:pointer; }
  button:hover { background:rgba(255,255,255,.12); }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  label.slider { display:flex; align-items:center; gap:8px; width:100%; color:var(--muted); font-size:13px; margin-top:8px; }
  label.slider input { flex:1; accent-color:var(--accent); }
  .drop { display:block; margin-top:6px; padding:10px; border:1px dashed var(--line); border-radius:10px; color:var(--muted); font-size:13px; text-align:center; }
  .drop input { display:none; }
  .drop b { color:var(--text); cursor:pointer; text-decoration:underline; }
  #status { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); padding:12px 16px; background:var(--panel); border:1px solid var(--line); border-radius:10px; }
  #status[hidden] { display:none; }
  body.dragging #stage { outline:3px dashed var(--accent); outline-offset:-12px; }
  @media (max-width: 640px) {
    .panel { left:12px; right:12px; top:auto; bottom:12px; width:auto; max-height:44%; padding:12px; }
    .panel .sub { display:none; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>
<div id="status">Загрузка модели…</div>
<aside class="panel">
  <h1 id="title">3D-просмотр</h1>
  <p class="sub">Вращайте мышью или пальцем, колесо или щипок — масштаб.</p>

  <div class="section">
    <h2>Анимации</h2>
    <div class="clips" id="clips"></div>
    <div class="row" style="margin-top:8px">
      <button id="play">⏸ Пауза</button>
      <button id="stop">⏹ Стоп</button>
      <button id="loop" class="on">🔁 Повтор</button>
    </div>
    <label class="slider">Скорость <input id="speed" type="range" min="0.25" max="2" step="0.25" value="1"><span id="speedVal">1×</span></label>
  </div>

  <div class="section">
    <h2>Вид</h2>
    <div class="row">
      <button id="rotate">⟳ Автоповорот</button>
      <button id="reset">◎ Сбросить вид</button>
      <button id="full">⛶ Полный экран</button>
    </div>
  </div>

  <div class="section">
    <h2>Своя модель</h2>
    <label class="drop">Перетащите файл .glb в окно или <b>выберите файл</b><input id="file" type="file" accept=".glb,.gltf"></label>
  </div>
</aside>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const stage = document.getElementById('stage');
const status = document.getElementById('status');
const clipsBox = document.getElementById('clips');
const playBtn = document.getElementById('play');
const loopBtn = document.getElementById('loop');
const speed = document.getElementById('speed');
const speedVal = document.getElementById('speedVal');
const rotateBtn = document.getElementById('rotate');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x161b27);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.01, 1000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
scene.add(sun, new THREE.HemisphereLight(0xdfe8ff, 0x2a2f3a, 0.6));

const ground = new THREE.Mesh(new THREE.CircleGeometry(1, 64), new THREE.ShadowMaterial({ opacity: 0.35 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const loader = new GLTFLoader();
const clock = new THREE.Clock();
let model = null, mixer = null, actions = [], current = null, paused = false, loopOn = true, homeView = null;

function setStatus(text) { status.hidden = !text; status.textContent = text || ''; }

function frameModel(obj) {
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  obj.position.sub(new THREE.Vector3(center.x, box.min.y, center.z));
  const radius = Math.max(size.x, size.y, size.z) || 1;
  const target = new THREE.Vector3(0, size.y / 2, 0);
  // в узком вертикальном экране отодвигаем камеру, чтобы модель влезла по ширине
  const dist = radius * 1.9 * Math.max(1, 0.75 / (innerWidth / innerHeight));
  camera.near = radius / 100; camera.far = radius * 100; fitView();
  homeView = { pos: new THREE.Vector3(dist * 0.7, size.y * 0.55 + radius * 0.35, dist), target };
  ground.scale.setScalar(radius * 1.6);
  sun.position.set(radius * 2, radius * 4, radius * 2.5);
  const s = sun.shadow.camera; s.left = s.bottom = -radius * 2; s.right = s.top = radius * 2; s.far = radius * 12; s.updateProjectionMatrix();
  resetView();
}

function resetView() {
  if (!homeView) return;
  camera.position.copy(homeView.pos);
  controls.target.copy(homeView.target);
  controls.update();
}

function applyLoop(action) {
  action.setLoop(loopOn ? THREE.LoopRepeat : THREE.LoopOnce, Infinity);
  action.clampWhenFinished = !loopOn;
}

function playClip(i) {
  const next = actions[i];
  if (!next) return;
  applyLoop(next);
  next.reset().setEffectiveTimeScale(1).setEffectiveWeight(1).play();
  if (current && current !== next) current.crossFadeTo(next, 0.35, false);
  current = next;
  paused = false; mixer.timeScale = Number(speed.value);
  playBtn.textContent = '⏸ Пауза';
  [...clipsBox.children].forEach((b, j) => b.classList.toggle('on', j === i));
}

function buildClips(clips) {
  clipsBox.innerHTML = '';
  if (!clips.length) { clipsBox.textContent = 'В этой модели нет анимаций.'; return; }
  clips.forEach((clip, i) => {
    const b = document.createElement('button');
    b.textContent = clip.name || `Анимация ${i + 1}`;
    b.onclick = () => playClip(i);
    clipsBox.appendChild(b);
  });
}

function showModel(gltf, name) {
  if (model) { scene.remove(model); mixer?.stopAllAction(); }
  model = gltf.scene;
  model.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  scene.add(model);
  frameModel(model);
  mixer = new THREE.AnimationMixer(model);
  actions = gltf.animations.map(c => mixer.clipAction(c));
  current = null;
  buildClips(gltf.animations);
  const idle = gltf.animations.findIndex(c => /idle/i.test(c.name));
  if (actions.length) playClip(idle >= 0 ? idle : 0);
  document.getElementById('title').textContent = name;
  setStatus('');
}

function loadUrl(url, name) {
  setStatus('Загрузка модели…');
  loader.load(url, g => showModel(g, name),
    e => { if (e.total) setStatus(`Загрузка модели… ${Math.round(e.loaded / e.total * 100)}%`); },
    () => setStatus('Не удалось загрузить модель'));
}

function loadFile(file) {
  if (!file) return;
  setStatus('Открываю файл…');
  file.arrayBuffer().then(buf => loader.parse(buf, '', g => showModel(g, file.name), () => setStatus('Файл не похож на модель .glb')));
}

playBtn.onclick = () => {
  if (!mixer) return;
  paused = !paused;
  mixer.timeScale = paused ? 0 : Number(speed.value);
  playBtn.textContent = paused ? '▶ Играть' : '⏸ Пауза';
};
document.getElementById('stop').onclick = () => {
  mixer?.stopAllAction(); current = null; paused = false; playBtn.textContent = '⏸ Пауза';
  [...clipsBox.children].forEach(b => b.classList.remove('on'));
};
loopBtn.onclick = () => {
  loopOn = !loopOn; loopBtn.classList.toggle('on', loopOn);
  if (current) { applyLoop(current); if (loopOn && !current.isRunning()) current.reset().play(); }
};
speed.oninput = () => { speedVal.textContent = `${speed.value}×`; if (mixer && !paused) mixer.timeScale = Number(speed.value); };
rotateBtn.onclick = () => { controls.autoRotate = !controls.autoRotate; rotateBtn.classList.toggle('on', controls.autoRotate); };
document.getElementById('reset').onclick = resetView;
document.getElementById('full').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
document.getElementById('file').onchange = e => loadFile(e.target.files[0]);
addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
addEventListener('dragleave', () => document.body.classList.remove('dragging'));
addEventListener('drop', e => { e.preventDefault(); document.body.classList.remove('dragging'); loadFile(e.dataTransfer.files[0]); });

// Сдвигаем картинку, чтобы панель не закрывала модель: на компьютере влево, на телефоне вверх.
function fitView() {
  camera.aspect = innerWidth / innerHeight;
  const phone = innerWidth <= 640;
  camera.setViewOffset(innerWidth, innerHeight, phone ? 0 : 150, phone ? innerHeight * 0.2 : 0, innerWidth, innerHeight);
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', fitView);
fitView();

renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  mixer?.update(dt);
  controls.update();
  renderer.render(scene, camera);
});

loadUrl('RobotExpressive.glb', 'Робот (пример)');
</script>
</body>
</html>
