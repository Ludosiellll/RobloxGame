<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Шаблон игры</title>
    <!-- Yandex Games SDK: только относительный путь, на платформе файл отдаёт сам Яндекс -->
    <script src="/sdk.js"></script>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #14161f; color: #fff;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
        touch-action: none; overscroll-behavior: none; }
      canvas { display: block; position: fixed; inset: 0; }
      #ui { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column;
        align-items: center; justify-content: flex-end; gap: 12px; padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); }
      #ui button { pointer-events: auto; font: 600 18px system-ui, sans-serif; color: #14161f; background: #ffd34d;
        border: 0; border-radius: 14px; padding: 14px 22px; min-width: 220px; min-height: 52px; }
      #ui button:disabled { opacity: .5; }
      #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    </style>
  </head>
  <body oncontextmenu="return false">
    <div id="loading">Загрузка…</div>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
